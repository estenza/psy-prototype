name: Deploy Staging

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  YC_FOLDER_ID: b1ghrmp0mr8mr0jcj9gc
  YC_SERVICE_ACCOUNT_ID: ajeh4qnls5se5raj12ua
  YC_CONTAINER_NAME: psy-staging-container
  YC_NETWORK_ID: enpgiiep4cceg1u2j18d
  IMAGE: cr.yandex/crphtumcsi9us93u61ir/psy:staging
  STAGING_URL: https://staging.vnutri.live
  STAGING_ADMIN_HOST: ctl-7e78cf9d.vnutri.live

jobs:
  deploy:
    name: Build, Push, Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging

    steps:
      - name: Validate Yandex auth secret
        env:
          YC_SA_JSON_CREDENTIALS: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
        run: |
          if [ -z "${YC_SA_JSON_CREDENTIALS//[[:space:]]/}" ]; then
            echo "::error::Missing YC_SA_JSON_CREDENTIALS. Add it as an Environment secret in GitHub: Settings -> Environments -> staging -> Secrets and variables -> Actions."
            exit 1
          fi

          node <<'NODE'
          const raw = process.env.YC_SA_JSON_CREDENTIALS;
          const expectedServiceAccountId = process.env.YC_SERVICE_ACCOUNT_ID?.trim();

          let parsed;

          try {
            parsed = JSON.parse(raw);
          } catch {
            console.error(
              "::error::YC_SA_JSON_CREDENTIALS in the staging Environment is not valid JSON. Paste the full Yandex Cloud authorized key JSON into GitHub: Settings -> Environments -> staging -> Secrets and variables -> Actions.",
            );
            process.exit(1);
          }

          const requiredFields = ["id", "service_account_id", "private_key"];
          const missingFields = requiredFields.filter((field) => {
            const value = parsed?.[field];
            return typeof value !== "string" || value.trim().length === 0;
          });

          if (missingFields.length > 0) {
            console.error(
              `::error::YC_SA_JSON_CREDENTIALS in the staging Environment is missing required authorized-key fields: ${missingFields.join(", ")}.`,
            );
            process.exit(1);
          }

          if (
            expectedServiceAccountId &&
            parsed.service_account_id !== expectedServiceAccountId
          ) {
            console.error(
              `::warning::YC_SA_JSON_CREDENTIALS is valid JSON, but it belongs to service account ${parsed.service_account_id}, while this workflow is configured for ${expectedServiceAccountId}.`,
            );
          } else {
            console.log(
              `Yandex auth secret is present and valid for staging service account ${expectedServiceAccountId || parsed.service_account_id}.`,
            );
          }
          NODE

      - name: Validate auth database secret
        env:
          AUTH_DATABASE_URL: ${{ secrets.AUTH_DATABASE_URL }}
        run: |
          if [ -z "${AUTH_DATABASE_URL//[[:space:]]/}" ]; then
            echo "::error::Missing AUTH_DATABASE_URL. Add it as an Environment secret in GitHub: Settings -> Environments -> staging -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Validate admin rollout secrets
        env:
          ADMIN_APP_HOST: ${{ env.STAGING_ADMIN_HOST }}
          ADMIN_APP_URL: ${{ secrets.ADMIN_APP_URL }}
          ADMIN_ALLOWED_EMAILS: ${{ secrets.ADMIN_ALLOWED_EMAILS }}
          ADMIN_ACCESS_KEY: ${{ secrets.ADMIN_ACCESS_KEY }}
        run: |
          has_admin_host=0
          has_allowlist=0
          has_admin_key=0

          if [ -n "${ADMIN_APP_HOST//[[:space:]]/}" ] || [ -n "${ADMIN_APP_URL//[[:space:]]/}" ]; then
            has_admin_host=1
          fi

          if [ -n "${ADMIN_ALLOWED_EMAILS//[[:space:]]/}" ]; then
            has_allowlist=1
          fi

          if [ -n "${ADMIN_ACCESS_KEY//[[:space:]]/}" ]; then
            has_admin_key=1
          fi

          if [ "$has_admin_key" -eq 1 ] && [ "$has_admin_host" -eq 0 ]; then
            echo "::error::ADMIN_ACCESS_KEY is set but ADMIN_APP_HOST/ADMIN_APP_URL is empty in staging Environment secrets."
            exit 1
          fi

          if [ "$has_admin_key" -eq 1 ] && [ "$has_allowlist" -eq 0 ]; then
            echo "::error::ADMIN_ACCESS_KEY is set but ADMIN_ALLOWED_EMAILS is empty in staging Environment secrets."
            exit 1
          fi

          if [ "$has_admin_host" -eq 1 ] && [ "$has_allowlist" -eq 0 ]; then
            echo "::warning::ADMIN_APP_HOST/ADMIN_APP_URL is set but ADMIN_ALLOWED_EMAILS is empty; admin access will be denied for everyone."
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js for migrations
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies for migrations
        run: |
          corepack enable
          yarn install --immutable

      - name: Apply PostgreSQL migrations
        env:
          AUTH_DATABASE_URL: ${{ secrets.AUTH_DATABASE_URL }}
        run: yarn migrate:auth:postgres:schema

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate Docker to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Build and push linux/amd64 staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ env.IMAGE }}

      - name: Deploy new staging Serverless Container revision
        id: deploy
        uses: yc-actions/yc-sls-container-deploy@v4
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          container-name: ${{ env.YC_CONTAINER_NAME }}
          folder-id: ${{ env.YC_FOLDER_ID }}
          revision-service-account-id: ${{ env.YC_SERVICE_ACCOUNT_ID }}
          revision-cores: 1
          revision-memory: 512Mb
          revision-core-fraction: 100
          revision-concurrency: 8
          revision-execution-timeout: 30
          revision-image-url: ${{ env.IMAGE }}
          revision-network-id: ${{ env.YC_NETWORK_ID }}
          revision-env: |
            APP_ENV=staging
            AUTH_APP_URL=https://staging.vnutri.live
            AUTH_DATABASE_URL=${{ secrets.AUTH_DATABASE_URL }}
            AUTH_DATABASE_SSL=false
            ADMIN_APP_HOST=${{ env.STAGING_ADMIN_HOST }}
            ADMIN_APP_URL=${{ secrets.ADMIN_APP_URL }}
            ADMIN_ALLOWED_EMAILS=${{ secrets.ADMIN_ALLOWED_EMAILS }}
            ADMIN_ACCESS_KEY=${{ secrets.ADMIN_ACCESS_KEY }}

      - name: Smoke check staging URL
        run: |
          curl --fail --show-error --silent --location --retry 5 --retry-delay 3 --head "${STAGING_URL}"
