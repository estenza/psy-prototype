name: Deploy Staging

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  YC_FOLDER_ID: b1ghrmp0mr8mr0jcj9gc
  YC_SERVICE_ACCOUNT_ID: ajeh4qnls5se5raj12ua
  YC_CONTAINER_NAME: psy-staging-container
  IMAGE: cr.yandex/crphtumcsi9us93u61ir/psy:staging
  STAGING_URL: https://staging.vnutri.live

jobs:
  deploy:
    name: Build, Push, Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging

    steps:
      - name: Validate Yandex auth secret
        run: |
          if [ -z "${{ secrets.YC_SA_JSON_CREDENTIALS }}" ]; then
            echo "::error::Missing YC_SA_JSON_CREDENTIALS in the staging GitHub Environment"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate Docker to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Build and push linux/amd64 staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ env.IMAGE }}

      - name: Deploy new staging Serverless Container revision
        id: deploy
        uses: yc-actions/yc-sls-container-deploy@v4
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          container-name: ${{ env.YC_CONTAINER_NAME }}
          folder-id: ${{ env.YC_FOLDER_ID }}
          revision-service-account-id: ${{ env.YC_SERVICE_ACCOUNT_ID }}
          revision-cores: 1
          revision-memory: 512Mb
          revision-core-fraction: 100
          revision-concurrency: 8
          revision-execution-timeout: 30
          revision-image-url: ${{ env.IMAGE }}
          revision-env: |
            APP_ENV=staging
            AUTH_APP_URL=https://staging.vnutri.live
            AUTH_DATABASE_PATH=/tmp/psy-staging.db

      - name: Smoke check staging URL
        run: |
          curl --fail --show-error --silent --location --retry 5 --retry-delay 3 --head "${STAGING_URL}"
