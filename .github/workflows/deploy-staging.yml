name: Deploy Staging

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  YC_FOLDER_ID: b1ghrmp0mr8mr0jcj9gc
  YC_SERVICE_ACCOUNT_ID: ajeh4qnls5se5raj12ua
  YC_CONTAINER_NAME: psy-staging-container
  HYVOR_TALK_WEBSITE_ID: 15244
  IMAGE: cr.yandex/crphtumcsi9us93u61ir/psy:staging
  STAGING_URL: https://staging.vnutri.live

jobs:
  deploy:
    name: Build, Push, Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging

    steps:
      - name: Validate deploy configuration
        env:
          YC_SA_JSON_CREDENTIALS: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          HYVOR_TALK_DATA_API_KEY: ${{ secrets.HYVOR_TALK_DATA_API_KEY }}
          HYVOR_TALK_CONSOLE_API_KEY: ${{ secrets.HYVOR_TALK_CONSOLE_API_KEY }}
          AUTH_EMAIL_FROM: ${{ secrets.AUTH_EMAIL_FROM }}
          AUTH_SMTP_HOST: ${{ secrets.AUTH_SMTP_HOST }}
        run: |
          if [ -z "${YC_SA_JSON_CREDENTIALS//[[:space:]]/}" ]; then
            echo "::error::Missing YC_SA_JSON_CREDENTIALS. Add it as an Environment secret in GitHub: Settings -> Environments -> staging -> Secrets and variables -> Actions."
            exit 1
          fi

          node <<'NODE'
          const raw = process.env.YC_SA_JSON_CREDENTIALS;
          const expectedServiceAccountId = process.env.YC_SERVICE_ACCOUNT_ID?.trim();
          const hyvorSecrets = [
            "HYVOR_TALK_DATA_API_KEY",
            "HYVOR_TALK_CONSOLE_API_KEY",
          ].filter((name) => !(process.env[name]?.trim()));
          const smtpConfigured = Boolean(
            process.env.AUTH_EMAIL_FROM?.trim() && process.env.AUTH_SMTP_HOST?.trim(),
          );

          let parsed;

          try {
            parsed = JSON.parse(raw);
          } catch {
            console.error(
              "::error::YC_SA_JSON_CREDENTIALS in the staging Environment is not valid JSON. Paste the full Yandex Cloud authorized key JSON into GitHub: Settings -> Environments -> staging -> Secrets and variables -> Actions.",
            );
            process.exit(1);
          }

          const requiredFields = ["id", "service_account_id", "private_key"];
          const missingFields = requiredFields.filter((field) => {
            const value = parsed?.[field];
            return typeof value !== "string" || value.trim().length === 0;
          });

          if (missingFields.length > 0) {
            console.error(
              `::error::YC_SA_JSON_CREDENTIALS in the staging Environment is missing required authorized-key fields: ${missingFields.join(", ")}.`,
            );
            process.exit(1);
          }

          if (
            expectedServiceAccountId &&
            parsed.service_account_id !== expectedServiceAccountId
          ) {
            console.error(
              `::warning::YC_SA_JSON_CREDENTIALS is valid JSON, but it belongs to service account ${parsed.service_account_id}, while this workflow is configured for ${expectedServiceAccountId}.`,
            );
          } else {
            console.log(
              `Yandex auth secret is present and valid for staging service account ${expectedServiceAccountId || parsed.service_account_id}.`,
            );
          }

          if (hyvorSecrets.length > 0) {
            console.warn(
              `::warning::Missing staging Environment secrets: ${hyvorSecrets.join(", ")}. .env.local is no longer baked into the Docker image, so Hyvor-powered comments may lose write/admin capabilities after deploy.`,
            );
          } else {
            console.log("Hyvor runtime secrets are present for staging deploy.");
          }

          if (!smtpConfigured) {
            console.warn(
              "::warning::AUTH_EMAIL_FROM and/or AUTH_SMTP_HOST are missing in the staging Environment. Password reset emails will only work after SMTP secrets are configured.",
            );
          } else {
            console.log("SMTP runtime configuration is present for staging deploy.");
          }
          NODE

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate Docker to Yandex Container Registry
        uses: yc-actions/yc-cr-login@v3
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}

      - name: Build and push linux/amd64 staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          provenance: false
          push: true
          tags: ${{ env.IMAGE }}

      - name: Deploy new staging Serverless Container revision
        id: deploy
        uses: yc-actions/yc-sls-container-deploy@v4
        with:
          yc-sa-json-credentials: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
          container-name: ${{ env.YC_CONTAINER_NAME }}
          folder-id: ${{ env.YC_FOLDER_ID }}
          revision-service-account-id: ${{ env.YC_SERVICE_ACCOUNT_ID }}
          revision-cores: 1
          revision-memory: 512Mb
          revision-core-fraction: 100
          revision-concurrency: 8
          revision-execution-timeout: 30
          revision-image-url: ${{ env.IMAGE }}
          revision-env: |
            APP_ENV=staging
            AUTH_APP_URL=https://staging.vnutri.live
            AUTH_DATABASE_PATH=/tmp/psy-staging.db
            AUTH_EMAIL_FROM=${{ secrets.AUTH_EMAIL_FROM }}
            AUTH_SMTP_HOST=${{ secrets.AUTH_SMTP_HOST }}
            AUTH_SMTP_PORT=${{ secrets.AUTH_SMTP_PORT }}
            AUTH_SMTP_SECURE=${{ secrets.AUTH_SMTP_SECURE }}
            AUTH_SMTP_USERNAME=${{ secrets.AUTH_SMTP_USERNAME }}
            AUTH_SMTP_PASSWORD=${{ secrets.AUTH_SMTP_PASSWORD }}
            AUTH_SMTP_HELO_HOST=${{ secrets.AUTH_SMTP_HELO_HOST }}
            HYVOR_TALK_WEBSITE_ID=${{ env.HYVOR_TALK_WEBSITE_ID }}
            HYVOR_TALK_DATA_API_KEY=${{ secrets.HYVOR_TALK_DATA_API_KEY }}
            HYVOR_TALK_CONSOLE_API_KEY=${{ secrets.HYVOR_TALK_CONSOLE_API_KEY }}

      - name: Smoke check staging URL
        run: |
          curl --fail --show-error --silent --location --retry 5 --retry-delay 3 --head "${STAGING_URL}"
